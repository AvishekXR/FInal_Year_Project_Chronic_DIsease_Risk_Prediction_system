name: health_prediction_app
description: Health Risk Prediction - Kidney & Diabetes (BIT Final Year Project)
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core
  http: ^1.2.2
  fluttertoast: ^8.2.8
  google_fonts: ^6.2.1
  flutter_spinkit: ^5.2.1
  provider: ^6.1.2           # For language toggle (English/Nepali)

  # Icons & Material
  cupertino_icons: ^1.0.8
  material_symbols_icons: ^4.2774.1

  # UI Enhancements
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/logo.png"
  min_sdk_android: 21

  # Assets (create these folders later)
  assets:
    - assets/
    - assets/images/
    - assets/animations/